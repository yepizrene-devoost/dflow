version: 2

project_name: dflow

release:
  mode: replace
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    binary: dflow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

snapshot:
  version_template: "snapshot-{{ .ShortCommit }}"

# No `changelog:` block is configured on purpose: the GitHub release body is
# supplied by `make release` through `--release-notes=RELEASE_NOTES.md`, extracted
# from the newest `## 📦` section of CHANGELOG.md, so GoReleaser never generates one.
